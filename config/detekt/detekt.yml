Compose:
  ComposableAnnotationNaming:
    active: true
  ComposableNaming:
    active: true
  ComposableParamOrder:
    active: true
  CompositionLocalAllowlist:
    active: true
    # These are deliberate, documented CompositionLocals (DESIGN.md): LocalAppTheme /
    # LocalSnackbarHostState are the project's Material3-bridging theme API, and
    # LocalSunsetSharedTransitionScope / LocalSunsetNavigator are internal plumbing for the
    # ui_common navigation wrapper. Only :ui_common defines new CompositionLocals; the rule
    # still catches any new one introduced elsewhere or added here without review.
    allowedCompositionLocals: LocalAppTheme,LocalSnackbarHostState,LocalSunsetSharedTransitionScope,LocalSunsetNavigator
  CompositionLocalNaming:
    active: true
  ConditionHoist:
    active: true
  ContentEmitterReturningValues:
    active: true
  ContentSlotReused:
    active: true
  ContentTrailingLambda:
    active: true
  DefaultsVisibility:
    active: true
  InvalidReadOnlyComposable:
    active: true
  LambdaParameterEventTrailing:
    active: true
  LambdaParameterInRestartableEffect:
    active: true
  Material2:
    active: true
  MissingNonRestartableComposable:
    active: true
  MissingReadOnlyComposable:
    active: true
  ModifierClickableOrder:
    active: true
  ModifierComposed:
    active: true
  ModifierMissing:
    active: true
  ModifierNaming:
    active: true
  ModifierNotUsedAtRoot:
    active: true
  ModifierReused:
    active: true
  ModifierWithoutDefault:
    active: true
  MultipleEmitters:
    active: true
  MutableParams:
    active: true
  MutableStateAutoboxing:
    active: true
  MutableStateParam:
    active: true
  ParameterNaming:
    active: true
    # onBackPressed is the documented convention in coding-conventions.md (used repo-wide,
    # ~80 occurrences across ~26 files, mirroring Activity.onBackPressed). onPageFinished
    # mirrors the platform WebViewClient.onPageFinished callback it wraps, and onTabSelected
    # mirrors the common Android OnTabSelectedListener naming. All three predate this rule;
    # renaming them is out of scope here and would fight established naming instead of a
    # real violation.
    allowedLambdaParameterNames: onBackPressed,onPageFinished,onTabSelected
  PreviewAnnotationNaming:
    active: true
  PreviewPublic:
    active: true
  RememberContentMissing:
    active: true
  RememberMissing:
    active: true
  StaleRememberUpdatedStateInRemember:
    active: true
  StateParam:
    active: true
  UnnecessaryComposable:
    active: true
  UnnecessaryLaunchedEffect:
    active: true
  VarsWithoutStateBacking:
    active: true
  ViewModelForwarding:
    active: true
    # These are the exact @Composable ViewModel-factory lambda types that :feature:home (the
    # sole navigation hub per architecture.md) forwards into ScrobbleScreen/TopArtistsScreen/
    # TopAlbumsScreen to hoist ViewModel creation. They are providers, not ViewModel instances,
    # which is the deliberate architecture for feature-to-feature navigation. Listed literally
    # (not as a wildcard) so a forwarding lambda of a different type, in any other module,
    # still gets caught.
    allowedForwardingOfTypes: "@Composable \\(TrackDetailKey\\) -> TrackViewModel,@Composable \\(AlbumKey\\) -> AlbumViewModel,@Composable \\(ArtistKey\\) -> ArtistViewModel"
  ViewModelInjection:
    active: true
    viewModelFactories: metroViewModel,viewModelFor
