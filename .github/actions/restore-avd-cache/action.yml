name: "Restore GMD AVD cache"
description: "Restore the Gradle Managed Device AVD, including its default_boot snapshot, so the emulator resumes from the snapshot instead of cold booting. Restore only; saving is handled by save-avd-cache on develop."
inputs:
  device:
    description: 'Identifier of the managed device slot (e.g. phone, tablet). Must match the value passed to save-avd-cache'
    required: true

runs:
  using: "composite"
  steps:
    - name: Restore gradle-managed AVD
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.android/avd/gradle-managed
          !~/.android/avd/gradle-managed/*.lock
          !~/.android/avd/gradle-managed/active_gradle_devices*
        key: gmd-avd-${{ runner.os }}-${{ inputs.device }}-develop
