name: "Setup Gradle"
description: "Setup Gradle and restore the shared Gradle caches. Restore only; saving is handled by save-gradle-cache on develop."
inputs:
  use-build-cache:
    description: 'Boolean value whether to restore the Gradle build cache'
    required: true
  cache-key:
    description: 'Identifier of the per-job build cache slot (e.g. build, test, lint). Required when use-build-cache is true'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: set up JDK
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: zulu
        java-version: 21
    - name: Restore gradle wrapper
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/wrapper
        key: gradle-wrapper-develop

    - name: Restore gradle dependencies dir
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches/jars-*
          ~/.gradle/caches/transforms-*
          ~/.gradle/caches/modules-*
        key: gradle-dependencies-develop
    - name: Restore gradle build results
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ inputs.use-build-cache == 'true' }}
      with:
        path: |
          .gradle
          ~/.gradle/caches/build-cache-*
          ~/.gradle/caches/[0-9]*.* # TODO: specify latest only
        key: gradle-build-cache-${{ runner.os }}-${{ inputs.cache-key }}-develop
