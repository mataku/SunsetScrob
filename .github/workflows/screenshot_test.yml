name: Run layout test

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch"
        required: true
        default: "develop"
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.head_ref || 'develop' }}-integration
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx8g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g"

jobs:
  screenshot_test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.branch }}
      - uses: ./.github/actions/setup-gradle
        with:
          use-build-cache: 'true'
      - name: Setup env
        env:
          LAST_FM_API_KEY: ${{ secrets.LAST_FM_API_KEY }}
          LAST_FM_SHARED_SECRET: ${{ secrets.LAST_FM_SHARED_SECRET }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}
        run: |
          echo "API_KEY=\"$LAST_FM_API_KEY\"" >> local.properties
          echo "SHARED_SECRET=\"$LAST_FM_SHARED_SECRET\"" >> local.properties
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
      - name: Run screenshot tests
        run: ./gradlew verifyRoborazziDebug --no-configuration-cache -PonlyScreenshotTest=true
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-test-reports
          path: |
            **/build/reports/roborazzi/**
            **/build/outputs/roborazzi/**
          retention-days: 7
