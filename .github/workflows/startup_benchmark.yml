name: Startup benchmark

on:
  schedule:
    # Saturday 03:00 UTC (12:00 JST)
    - cron: '0 3 * * 6'
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch"
        required: true
        default: "develop"

concurrency:
  group: startup-benchmark
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g"

jobs:
  startup_benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ./.github/actions/setup-gradle
        with:
          use-build-cache: 'false'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - uses: ./.github/actions/sunsetscrob-setup
        with:
          last-fm-api-key: ${{ secrets.LAST_FM_API_KEY }}
          last-fm-shared-secret: ${{ secrets.LAST_FM_SHARED_SECRET }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
      - name: Prepare authentication
        run: |
          echo -n "${{ secrets.SUNSETSCROB_KEYSTORE }}" | base64 -d > SunsetScrob.jks
      - name: Generate baseline profile
        env:
          SUNSET_KEY_ALIAS: ${{ secrets.SUNSET_KEY_ALIAS }}
          SUNSET_KEY_PASSWORD: ${{ secrets.SUNSET_KEY_PASSWORD }}
          SUNSET_STORE_PASSWORD: ${{ secrets.SUNSET_STORE_PASSWORD }}
        run: |
          ./gradlew cleanManagedDevices --unused-only
          ./gradlew app:generateReleaseBaselineProfile \
            -Pandroid.testoptions.manageddevices.emulator.gpu="swiftshader_indirect" \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile
      - name: Move baseline profile file
        run: mv app/src/release/generated/baselineProfiles/baseline-prof.txt app/src/main/baseline-prof.txt
      - name: Run startup benchmark
        env:
          SUNSET_KEY_ALIAS: ${{ secrets.SUNSET_KEY_ALIAS }}
          SUNSET_KEY_PASSWORD: ${{ secrets.SUNSET_KEY_PASSWORD }}
          SUNSET_STORE_PASSWORD: ${{ secrets.SUNSET_STORE_PASSWORD }}
        run: |
          ./gradlew :benchmark:pixel9Api35BenchmarkReleaseAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu="swiftshader_indirect" \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark
      - name: Write benchmark summary
        if: always()
        run: |
          set -euo pipefail
          output_dir=benchmark/build/outputs/managed_device_android_test_additional_output
          json_files=$(find "$output_dir" -name '*-benchmarkData.json' 2>/dev/null | sort || true)

          {
            echo "## Startup Benchmark"
            echo ""
            echo "Device: \`pixel9Api35\` (Pixel 9, API 35)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$json_files" ]; then
            echo "_No benchmark JSON output was found._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "| Test | Metric | Min | Median | Max |"
            echo "| --- | --- | ---: | ---: | ---: |"
            for f in $json_files; do
              jq -r '
                def round1: . * 10 | round / 10;
                .benchmarks[]
                | .name as $name
                | .metrics
                | to_entries[]
                | "| \($name) | \(.key) | \(.value.minimum | round1) | \(.value.median | round1) | \(.value.maximum | round1) |"
              ' "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: startup-benchmark-results
          path: |
            benchmark/build/outputs/managed_device_android_test_additional_output/**
            benchmark/build/outputs/androidTest-results/**
            benchmark/build/reports/androidTests/managedDevice/**
          retention-days: 14
          if-no-files-found: warn
