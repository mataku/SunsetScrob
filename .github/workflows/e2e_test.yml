name: E2E test

on:
  schedule:
    # Friday 06:00 UTC (Friday 15:00 JST)
    - cron: '0 6 * * 5'
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.ref_name }}-e2e
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx8g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: pixel6Api35
            cache-key: gmd-pixel6-api35-google-x86_64-v1
            script: scripts/run_e2e_phone.sh
            artifact-suffix: phone
          - device: pixelTabletApi35
            cache-key: gmd-pixel-tablet-api35-aosp-atd-x86_64-v1
            script: scripts/run_e2e_tablet.sh
            artifact-suffix: tablet

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ./.github/actions/setup-gradle
        with:
          use-build-cache: 'true'
      - uses: ./.github/actions/sunsetscrob-setup
        with:
          last-fm-api-key: ${{ secrets.LAST_FM_API_KEY }}
          last-fm-shared-secret: ${{ secrets.LAST_FM_SHARED_SECRET }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}

      - name: Echo Android SDK paths
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -1 "$ANDROID_HOME" 2>/dev/null || echo "(no SDK dir)"
          ls -1 "$ANDROID_HOME/system-images" 2>/dev/null || echo "(no system-images yet)"
          ls -1 ~/.android/avd 2>/dev/null || echo "(no AVD yet)"

      - name: GMD cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.android/avd
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images
          key: ${{ matrix.cache-key }}

      - name: Build debug APK & androidTest APK
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run E2E tests on ${{ matrix.device }}
        run: |
          bash ${{ matrix.script }} \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-reports-${{ matrix.artifact-suffix }}
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
            **/build/intermediates/managed_device_android_test_additional_output/**
          retention-days: 7
