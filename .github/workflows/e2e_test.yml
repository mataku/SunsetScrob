name: E2E test

on:
  schedule:
    # Friday 06:00 UTC (Friday 15:00 JST)
    - cron: '0 6 * * 5'
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.ref_name }}-e2e
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx8g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: pixel6Api35
            cache-key: gmd-pixel6-api35-google-x86_64-v1
            extra-args: ''
            artifact-suffix: phone
          - device: pixelTabletApi35
            cache-key: gmd-pixel-tablet-api35-aosp-atd-x86_64-v1
            extra-args: '-PincludeLargeScreenE2E=true'
            artifact-suffix: tablet

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ./.github/actions/setup-gradle
        with:
          use-build-cache: 'true'
      - uses: ./.github/actions/sunsetscrob-setup
        with:
          last-fm-api-key: ${{ secrets.LAST_FM_API_KEY }}
          last-fm-shared-secret: ${{ secrets.LAST_FM_SHARED_SECRET }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}

      - name: Echo Android SDK paths
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -1 "$ANDROID_HOME" 2>/dev/null || echo "(no SDK dir)"
          ls -1 "$ANDROID_HOME/system-images" 2>/dev/null || echo "(no system-images yet)"
          ls -1 ~/.android/avd 2>/dev/null || echo "(no AVD yet)"

      - name: GMD cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.android/avd
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images
          key: ${{ matrix.cache-key }}

      - name: Build debug APK & androidTest APK
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run E2E tests on ${{ matrix.device }}
        run: |
          mkdir -p app/build/outputs/e2e-recordings

          ADB="$ANDROID_HOME/platform-tools/adb"

          (
            for _ in $(seq 1 120); do
              if "$ADB" devices | grep -qE 'emulator-[0-9]+[[:space:]]+device$'; then
                if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
                  break
                fi
              fi
              sleep 2
            done
            "$ADB" shell screenrecord --output-format=h264 --bit-rate 800000 --size 540x960 --time-limit 180 - \
              > app/build/outputs/e2e-recordings/e2e-${{ matrix.artifact-suffix }}.h264 2>/dev/null || true
          ) &
          RECORD_PID=$!

          set +e
          ./gradlew :app:cleanManagedDevices --unused-only
          ./gradlew :app:${{ matrix.device }}DebugAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu="swiftshader_indirect" \
            ${{ matrix.extra-args }}
          RESULT=$?
          set -e

          kill -SIGINT $RECORD_PID 2>/dev/null || true
          wait $RECORD_PID 2>/dev/null || true

          exit $RESULT

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-reports-${{ matrix.artifact-suffix }}
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
            app/build/outputs/e2e-recordings/**
          retention-days: 7
