name: Smoke test

on:
  # No `paths` filter here: `Smoke test result` is a required check, and a required check that
  # never starts blocks the pull request. The `changes` job decides whether the suite runs.
  pull_request:
    branches:
      - '**'
  # Unfiltered on purpose: every merge refreshes the AVD and Gradle build caches that pull request
  # runs restore, and covers the commonMain changes the pull request path filter lets through.
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.ref_name }}-smoke
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    outputs:
      # Pushes to develop and manual runs always run the suite.
      smoke: ${{ github.event_name != 'pull_request' || steps.filter.outputs.smoke == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            smoke:
              - 'gradle/**'
              - 'gradle.properties'
              - 'settings.gradle.kts'
              - '**/build.gradle.kts'
              - 'build-logic/**'
              - 'app/**'
              - '**/src/androidMain/**'
              - 'scripts/run_smoke_*.sh'
              - '.github/workflows/smoke_test.yml'
              - '.github/actions/**'

  # Two jobs sharing their steps through a YAML anchor rather than one matrix job: a matrix job
  # skipped by `if` is never expanded, so its check shows up under the literal name `matrix.name`.
  phone:
    name: Phone
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    env:
      SMOKE_DEVICE: pixel6Api35
      SMOKE_SCRIPT: scripts/run_smoke_phone.sh
      SMOKE_VARIANT: phone

    steps: &smoke-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ./.github/actions/setup-gradle
        with:
          use-build-cache: 'true'
          cache-key: smoke
      - uses: ./.github/actions/restore-avd-cache
        with:
          device: ${{ env.SMOKE_VARIANT }}
      - uses: ./.github/actions/sunsetscrob-setup
        with:
          last-fm-api-key: ${{ secrets.LAST_FM_API_KEY }}
          last-fm-shared-secret: ${{ secrets.LAST_FM_SHARED_SECRET }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}

      - name: Echo Android SDK paths
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -1 "$ANDROID_HOME" 2>/dev/null || echo "(no SDK dir)"
          ls -1 "$ANDROID_HOME/system-images" 2>/dev/null || echo "(no system-images yet)"
          ls -1 ~/.android/avd 2>/dev/null || echo "(no AVD yet)"
          echo "--- gradle-managed AVDs ---"
          for avd in ~/.android/avd/gradle-managed/*.avd; do
            [ -d "$avd" ] || continue
            echo "$(basename "$avd") snapshots: $(ls -1 "$avd/snapshots" 2>/dev/null | tr '\n' ' ')"
          done

      # No separate assemble step: the managed device task builds both APKs itself, and a second
      # Gradle invocation would only pay the configuration phase again.
      - name: Build and run smoke tests on ${{ env.SMOKE_DEVICE }}
        run: |
          bash "$SMOKE_SCRIPT" \
            --no-configuration-cache \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - uses: ./.github/actions/save-avd-cache
        with:
          device: ${{ env.SMOKE_VARIANT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/save-gradle-cache
        with:
          use-build-cache: 'true'
          cache-key: smoke
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-reports-${{ env.SMOKE_VARIANT }}
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
            **/build/intermediates/managed_device_android_test_additional_output/**
          retention-days: 7

  tablet:
    name: Tablet
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    env:
      SMOKE_DEVICE: pixelTabletApi35
      SMOKE_SCRIPT: scripts/run_smoke_tablet.sh
      SMOKE_VARIANT: tablet

    steps: *smoke-steps

  # The only smoke check to mark as required: it reports on every pull request, whether the
  # suite ran or was skipped, and does not change when a device job is added.
  result:
    name: Smoke test result
    needs: [changes, phone, tablet]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - name: Check smoke results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHOULD_RUN: ${{ needs.changes.outputs.smoke }}
          PHONE_RESULT: ${{ needs.phone.result }}
          TABLET_RESULT: ${{ needs.tablet.result }}
        run: |
          echo "changes=$CHANGES_RESULT should_run=$SHOULD_RUN phone=$PHONE_RESULT tablet=$TABLET_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then
            exit 1
          fi
          if [ "$SHOULD_RUN" = "true" ]; then
            [ "$PHONE_RESULT" = "success" ] && [ "$TABLET_RESULT" = "success" ]
          else
            [ "$PHONE_RESULT" = "skipped" ] && [ "$TABLET_RESULT" = "skipped" ]
          fi

  notify-failure:
    name: Notify Discord on failure
    needs: [phone, tablet]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-slim
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          payload=$(jq -n \
            --arg content "<@${DISCORD_USER_ID}> Smoke test failed on \`${REF_NAME}\`. ${RUN_URL}" \
            '{content: $content, allowed_mentions: {parse: ["users"]}}')
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL"
