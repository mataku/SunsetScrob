android.enableJetifier=false
android.useAndroidX=true
android.enableR8.fullMode=true
org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.configuration-cache=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# detekt runs without type resolution: the plain `detekt` task is enough for the
# compose-rules and ktlint rule sets, and skipping the compilation-backed tasks
# keeps it in the same cost bracket as Konsist.
detekt.android.disabled=true
detekt.multiplatform.disabled=true
